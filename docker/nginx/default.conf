# ============================================================
# Nginx Virtual Hosts — Subdomain Reverse Proxy (HTTP-first)
# ============================================================

upstream api_backend {
    server api:4000;
    keepalive 32;
}

upstream web_frontend {
    server web:3000;
    keepalive 32;
}

upstream flood_relief_api_backend {
    server 127.0.0.1:4002;
    keepalive 32;
}

# ── API Gateway (api.${DOMAIN}) ─────────────────────────────
server {
    listen 80;
    server_name api.${DOMAIN};

    client_max_body_size 20M;

    # Apply Rate Limiting
    limit_req zone=api_limit burst=20 nodelay;

    # REST APIs
    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # WebSockets Gateway
    location /socket.io/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Web Application Client (app.${DOMAIN}) ──────────────────
server {
    listen 80;
    server_name app.${DOMAIN};

    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Kerala Flood Relief Portal (floodrelief.${DOMAIN}) ──────
# NOTE: this app is deployed bare-metal via PM2 (saas-flood-relief-api, port 4002),
# not as a docker-compose service like `api`/`web` above — hence the upstream target
# is 127.0.0.1 rather than a container service name. If this file isn't the actual
# source of the live nginx config, add this block to whichever config is, adjusting
# the upstream target to match.
server {
    listen 80;
    server_name floodrelief.${DOMAIN};

    client_max_body_size 20M;

    # Static frontend build — no node process needed, nginx serves it directly.
    root /var/www/whtzup-city/apps/flood-relief-web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://flood_relief_api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # React Router client-side routing — always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

